name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp run test
      - run: npm audit
      - name: Create tag if necessary
        id: version
        uses: fregante/daily-version-action@v3
      - name: Build versioned packages
        if: steps.version.outputs.created
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'source/manifest.json';
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          manifest.version = process.env.RELEASE_VERSION;
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          JS
          vp fmt source/manifest.json
          vp build
          vp build --mode firefox
          node scripts/check-build.mjs
      - uses: actions/upload-artifact@v6
        if: steps.version.outputs.created
        with:
          name: extension-chrome
          path: distribution
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: steps.version.outputs.created
        with:
          name: extension-firefox
          path: distribution-firefox
          if-no-files-found: error
      - name: Archive reproducible sources
        if: steps.version.outputs.created
        run: |
          zip -qr source.zip source test scripts package.json package-lock.json vite.config.ts .nvmrc .editorconfig .gitignore readme.md LICENSE
      - uses: actions/upload-artifact@v6
        if: steps.version.outputs.created
        with:
          name: source
          path: source.zip
          if-no-files-found: error
      - name: Create release
        if: steps.version.outputs.created
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd distribution && zip -qr ../chrome-unsigned.zip .)
          (cd distribution-firefox && zip -qr ../firefox-unsigned.zip .)
          gh release create "$RELEASE_VERSION" --generate-notes chrome-unsigned.zip firefox-unsigned.zip

  publish:
    needs: build
    if: needs.build.outputs.created
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            environment: Chrome
          - browser: firefox
            environment: Firefox
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          run-install: false
      - uses: actions/download-artifact@v7
        with:
          name: extension-${{ matrix.browser }}
          path: extension
      - uses: actions/download-artifact@v7
        if: matrix.browser == 'firefox'
        with:
          name: source
      - name: Publish to Chrome Web Store
        if: matrix.browser == 'chrome'
        run: npx chrome-webstore-upload-cli@3 upload --auto-publish
        working-directory: extension
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      - name: Publish to Firefox Add-ons
        if: matrix.browser == 'firefox'
        run: npx web-ext@9 sign --channel listed --approval-timeout 0 --source-dir extension --upload-source-code source.zip
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
