name: Test

on:
  - pull_request
  - push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp run test
      - run: npm audit
      - run: npx lockfile-lint --path package-lock.json --validate-https
